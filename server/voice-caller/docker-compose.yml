services:
  redis:
    image: redis:7-alpine
    command: redis-server --bind 127.0.0.1 --port 6379 --appendonly yes
    volumes: ["redis-data:/data"]
    network_mode: host
    restart: unless-stopped
    logging: {driver: json-file, options: {max-size: 10m, max-file: "3"}}
  livekit:
    image: livekit/livekit-server:latest
    command: --config /etc/livekit.yaml
    volumes: ["./livekit.yaml:/etc/livekit.yaml:ro"]
    network_mode: host
    restart: unless-stopped
    logging: {driver: json-file, options: {max-size: 10m, max-file: "3"}}
    depends_on: [redis]
  sip:
    image: livekit/sip:latest
    environment:
      SIP_CONFIG_FILE: /sip/config.yaml
    volumes: ["./sip.yaml:/sip/config.yaml:ro"]
    network_mode: host
    restart: unless-stopped
    logging: {driver: json-file, options: {max-size: 10m, max-file: "3"}}
    depends_on: [livekit]
volumes:
  redis-data:
