# Replace every PUBLIC_HOST with your server's public hostname (the PUBLIC_HOST value in config/superclaude.env.example), e.g.
#   sed -i "s/PUBLIC_HOST/$PUBLIC_HOST/g" /etc/nginx/sites-available/voice
# The services behind these paths check their own secret (a token the iPhone Shortcuts send, e.g. <ASK_TOKEN>); nothing secret is in this file.
server {
    listen 80;
    server_name PUBLIC_HOST;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name PUBLIC_HOST;
    ssl_certificate /etc/letsencrypt/live/PUBLIC_HOST/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/PUBLIC_HOST/privkey.pem;
    access_log off;
    add_header X-Content-Type-Options nosniff always;
    location /call/ { proxy_pass http://127.0.0.1:7891; proxy_set_header Host $host; limit_except GET POST { deny all; } }
    location /jobs/ { proxy_pass http://127.0.0.1:7893; proxy_set_header Host $host; limit_except GET POST { deny all; } }
    location /ask/ { client_max_body_size 15m; proxy_pass http://127.0.0.1:7894; proxy_set_header Host $host; limit_except POST { deny all; } }
    location /wake/ { proxy_pass http://127.0.0.1:7894; proxy_read_timeout 60s; proxy_set_header Host $host; limit_except POST { deny all; } }
    location /beat/ { proxy_pass http://127.0.0.1:7894; proxy_read_timeout 60s; proxy_set_header Host $host; limit_except POST { deny all; } }
    location /force/ { proxy_pass http://127.0.0.1:7894; proxy_read_timeout 60s; proxy_set_header Host $host; limit_except POST { deny all; } }
    location / { return 404; }
}
