#!KAMAILIO
# voice-sip-relay: keeps sip:SERVER_USER@sip.linphone.org registered and hands
# calls FROM the owner's Linphone account to livekit-sip (127.0.0.1:5060).
# Signalling only; SRTP media flows phone <-> livekit-sip directly.
#!include_file "/run/voice-sip-relay/defs.cfg"
# defs.cfg (written by gen.py from /etc/voice-caller/secrets.env) defines OWNER_USER, SERVER_USER, LINPHONE_NETS,
# PUBLIC_IP (string), CONTACT_ADDR (string "PUBLIC_IP:5070") and substdef PRIVATE_IP (this server's private/LAN IP).
# ASSUMPTION: the substdef/define mechanism was not re-tested with kamailio after parameterising; run `kamailio -c` (the unit does this at start).

debug=2
rundir="/run/voice-sip-relay"
log_stderror=yes
memdbg=5
memlog=5
children=2
tcp_children=2
auto_aliases=no
dns_try_ipv6=no
tcp_reuse_port=yes
tcp_connection_lifetime=3700
tcp_keepalive=yes
tcp_keepidle=30
tcp_keepintvl=10
tcp_keepcnt=3
listen=tcp:PRIVATE_IP:5070 advertise PUBLIC_IP:5070
listen=udp:127.0.0.1:5070
alias=PUBLIC_IP:5070

loadmodule "kex.so"
loadmodule "corex.so"
loadmodule "tm.so"
loadmodule "tmx.so"
loadmodule "sl.so"
loadmodule "rr.so"
loadmodule "pv.so"
loadmodule "maxfwd.so"
loadmodule "textops.so"
loadmodule "siputils.so"
loadmodule "xlog.so"
loadmodule "sanity.so"
loadmodule "ipops.so"
loadmodule "db_text.so"
loadmodule "uac.so"
loadmodule "ctl.so"

modparam("ctl", "binrpc", "unix:/run/voice-sip-relay/kamailio_ctl")
modparam("tm", "fr_timer", 5000)
modparam("tm", "fr_inv_timer", 60000)
modparam("rr", "enable_full_lr", 1)
modparam("uac", "reg_db_url", "text:///run/voice-sip-relay/db")
modparam("uac", "reg_contact_addr", CONTACT_ADDR)
modparam("uac", "reg_timer_interval", 30)
modparam("uac", "reg_retry_interval", 60)
modparam("uac", "reg_keep_callid", 1)
modparam("uac", "restore_mode", "none")

request_route {
	if (!mf_process_maxfwd_header("10")) { sl_send_reply("483", "Too Many Hops"); exit; }
	if (!sanity_check("1511", "7")) exit;

	if (has_totag()) {
		# Only two peers exist: livekit-sip on loopback and Linphone over our TCP link.
		loose_route();
		if ($si == "127.0.0.1" && $sp == 5060) {
			$du = "sip:sip.linphone.org;transport=tcp";
			force_send_socket(tcp:PRIVATE_IP:5070);
		} else if ($pr == "tcp" && is_in_subnet("$si", LINPHONE_NETS)) {
			$du = "sip:127.0.0.1:5060";
			force_send_socket(udp:127.0.0.1:5070);
		} else {
			xlog("L_NOTICE", "RELAY reject in-dialog $rm from $si\n");
			sl_send_reply("403", "Forbidden");
			exit;
		}
		if (is_method("BYE")) xlog("L_NOTICE", "RELAY BYE $ci from $si\n");
		if (!t_relay()) sl_reply_error();
		exit;
	}
	if (is_method("CANCEL")) { if (t_check_trans()) route(RELAY); exit; }
	if (is_method("ACK")) exit;
	t_check_trans();

	# Everything new must come from Linphone's servers over our registered TCP connection.
	if ($pr != "tcp" || !is_in_subnet("$si", LINPHONE_NETS)) {
		xlog("L_NOTICE", "RELAY reject $rm from $si ($pr)\n");
		sl_send_reply("403", "Forbidden");
		exit;
	}
	if (is_method("OPTIONS")) { sl_send_reply("200", "OK"); exit; }
	if (!is_method("INVITE")) { sl_send_reply("405", "Method Not Allowed"); exit; }
	if ($fU != OWNER_USER || $fd != "sip.linphone.org") {
		xlog("L_NOTICE", "RELAY reject INVITE from $fu\n");
		sl_send_reply("403", "Forbidden");
		exit;
	}
	xlog("L_NOTICE", "RELAY owner call $ci -> livekit\n");
	record_route();
	$ru = "sip:" + SERVER_USER + "@127.0.0.1:5060";
	route(RELAY);
}

route[RELAY] {
	# livekit-sip advertises the public IP in its Contact; reach it on loopback instead.
	if ($rd == PUBLIC_IP && ($rp == 5060 || $rp == "")) {
		$rd = "127.0.0.1"; $rp = 5060;
		if ($du != $null) $du = $null;
	}
	if ($rd == "127.0.0.1" || $dd == "127.0.0.1") {
		force_send_socket(udp:127.0.0.1:5070);
	} else {
		force_send_socket(tcp:PRIVATE_IP:5070);
	}
	if (!t_relay()) sl_reply_error();
	exit;
}
